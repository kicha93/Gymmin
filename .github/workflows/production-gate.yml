name: Production gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - name: Tracked secrets
        run: npm run security:secrets
      - name: Documentation
        working-directory: .
        run: npm run docs:validate
      - name: Dependency advisory policy
        run: npm run security:dependencies
      - name: Local-only architecture guard
        run: node ../../scripts/validate-local-only-runtime.mjs
      - name: Local product guard
        run: node ../../scripts/validate-local-product-runtime.mjs
      - name: Google Play release materials
        run: node ../../scripts/validate-google-play-release.mjs
      - name: Exercise catalog
        run: node ../../scripts/validate-exercise-catalog.mjs
      - name: Android source security
        run: npm run security:android
      - name: Tests
        run: npm test -- --reporter=default
      - name: TypeScript
        run: npm run typecheck
      - name: Expo Doctor
        run: npx expo-doctor
      - name: Production Expo export
        run: npx expo export --platform android --output-dir .expo-ci-export
      - name: Repository diff check
        working-directory: .
        run: git diff --check
      - name: Native debug APK smoke
        shell: bash
        env:
          NODE_ENV: development
        run: cd android && ./gradlew assembleDebug -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Generate ephemeral CI release key
        shell: bash
        run: >-
          keytool -genkeypair -noprompt
          -keystore "$RUNNER_TEMP/gymmin-ci-upload.jks"
          -storepass gymmin-ci-password
          -keypass gymmin-ci-password
          -alias gymmin-ci
          -keyalg RSA
          -keysize 2048
          -validity 2
          -dname "CN=Gymmin CI, OU=CI, O=Gymmin, L=Warsaw, C=PL"
      - name: Native release AAB smoke
        shell: bash
        env:
          NODE_ENV: production
          GYMMIN_UPLOAD_STORE_FILE: ${{ runner.temp }}/gymmin-ci-upload.jks
          GYMMIN_UPLOAD_STORE_PASSWORD: gymmin-ci-password
          GYMMIN_UPLOAD_KEY_ALIAS: gymmin-ci
          GYMMIN_UPLOAD_KEY_PASSWORD: gymmin-ci-password
        run: cd android && ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Verify native bundle signature
        shell: bash
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Verify merged release manifest
        shell: bash
        run: |
          manifest="android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
          test -f "$manifest"
          ! grep -q "android.permission.INTERNET" "$manifest"
          ! grep -q "com.android.vending.BILLING" "$manifest"
          ! grep -q "android.permission.SYSTEM_ALERT_WINDOW" "$manifest"
          ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
      - name: Verify exported Android components
        run: npm run security:android-components
