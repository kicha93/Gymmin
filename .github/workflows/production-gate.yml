name: Production gate

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gymmin_test
          POSTGRES_PASSWORD: gymmin_test_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gymmin_test -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GYMMIN_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=gymmin_test;Password=gymmin_test_password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore backend/Gymmin.Api.Tests/Gymmin.Api.Tests.csproj
      - run: dotnet build backend/Gymmin.Api.Tests/Gymmin.Api.Tests.csproj --configuration Release --no-restore --warnaserror
      - run: dotnet test backend/Gymmin.Api.Tests/Gymmin.Api.Tests.csproj --configuration Release --no-restore
      - run: dotnet tool restore
      - run: dotnet tool run dotnet-ef migrations has-pending-model-changes --project backend/Gymmin.Api/Gymmin.Api.csproj --startup-project backend/Gymmin.Api/Gymmin.Api.csproj --configuration Release
        env:
          Gymmin__Storage__Provider: Database
          Gymmin__Storage__DatabaseProvider: SQLite
      - run: dotnet list backend/Gymmin.Api.Tests/Gymmin.Api.Tests.csproj package --vulnerable --include-transitive

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: "17"
      - run: npm ci
      - run: npm run security:android
      - run: npm test
      - run: npm run typecheck
      - run: npx expo-doctor
      - run: npx expo export --platform android --output-dir .expo-ci-export
        env:
          EXPO_PUBLIC_USE_RN_FETCH: "1"
      - run: npm audit --audit-level=high
      - name: Generate ephemeral CI release key
        shell: bash
        run: >-
          keytool -genkeypair -noprompt
          -keystore "$RUNNER_TEMP/gymmin-ci-upload.jks"
          -storepass gymmin-ci-password
          -keypass gymmin-ci-password
          -alias gymmin-ci
          -keyalg RSA
          -keysize 2048
          -validity 2
          -dname "CN=Gymmin CI, OU=CI, O=Gymmin, L=Warsaw, C=PL"
      - name: Native Android release bundle smoke
        shell: bash
        env:
          EXPO_PUBLIC_API_BASE_URL: https://api.example.invalid
          EXPO_PUBLIC_USE_RN_FETCH: "1"
          GYMMIN_UPLOAD_STORE_FILE: ${{ runner.temp }}/gymmin-ci-upload.jks
          GYMMIN_UPLOAD_STORE_PASSWORD: gymmin-ci-password
          GYMMIN_UPLOAD_KEY_ALIAS: gymmin-ci
          GYMMIN_UPLOAD_KEY_PASSWORD: gymmin-ci-password
        run: cd android && ./gradlew bundleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon
      - name: Verify native bundle signature
        shell: bash
        run: jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab
      - name: Verify release manifest permissions
        shell: bash
        run: |
          manifest="android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml"
          test -f "$manifest"
          ! grep -q "android.permission.SYSTEM_ALERT_WINDOW" "$manifest"
          grep -q 'android:allowBackup="false"' "$manifest"
          grep -q 'android:usesCleartextTraffic="false"' "$manifest"
          grep -q 'android:networkSecurityConfig="@xml/network_security_config"' "$manifest"
          grep -q 'android:fullBackupContent="@xml/backup_rules"' "$manifest"
          grep -q 'android:dataExtractionRules="@xml/data_extraction_rules"' "$manifest"
          ! grep -q "android.permission.WRITE_EXTERNAL_STORAGE" "$manifest"
