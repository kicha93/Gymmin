services:
  postgres:
    image: postgres:16-alpine
    container_name: gymmin-postgres
    environment:
      POSTGRES_DB: gymmin
      POSTGRES_USER: gymmin
      POSTGRES_PASSWORD: gymmin-dev-password
    ports:
      - "5432:5432"
    volumes:
      - gymmin-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gymmin -d gymmin"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  gymmin-postgres-data:
